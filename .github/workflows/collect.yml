name: Collect Weather Lab ATCF

on:
  workflow_call:
    inputs:
      start:
        type: string
        default: ""
      end:
        type: string
        default: ""

permissions:
  contents: write

# Shared by the Cloudflare-triggered and manual backfill workflows.
concurrency:
  group: weatherlab-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect exact-cycle forecasts
        id: collect
        continue-on-error: true
        env:
          START_CYCLE: ${{ inputs.start }}
          END_CYCLE: ${{ inputs.end }}
        run: python fetch.py --start "$START_CYCLE" --end "$END_CYCLE"
      - name: Commit validated data
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ forecast_files/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update Weather Lab ATCF data"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
          done
          echo "::error::Could not push forecast data after three attempts."
          exit 1
      - name: Report collection errors
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Some sources failed validation or download. Valid updates were preserved."
          exit 1
