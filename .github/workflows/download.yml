name: Download Cyclone Data

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First cycle UTC (YYYYMMDDHH); leave both blank for the last 48 hours"
        type: string
        default: ""
      end:
        description: "Last cycle UTC (YYYYMMDDHH), inclusive; maximum range 31 days"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  download:
    uses: ./.github/workflows/collect.yml
    with:
      start: ${{ inputs.start }}
      end: ${{ inputs.end }}
